[project]
name = "pi-infer-questions-pipeline"
version = "0.0.0"
description = "Question extractor for pi: data pipeline, labelling, taggers, Core ML packing"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "coremltools>=9.0,<10",
  "huggingface_hub>=0.30",
  "markdown-it-py>=3.0",
  "numpy>=1.26",
  "onnx>=1.19",
  "onnxruntime==1.31.0",
  "openai>=1.60",
  "torch>=2.6",
  "transformers>=4.56",
]

[project.scripts]
corpus = "corpus:main"
extract = "extract:main"
label = "label_cli:main"
label-corpus = "label_corpus:main"
report = "report:main"
convert-ane = "ane:main"
convert-onnx = "onnx_pack:main"
parity-onnx = "onnx_pack:parity"
golden-onnx = "onnx_pack:golden"
parity-ane = "ane_pack:parity"
golden-ane = "ane_pack:golden"
train = "train:main"
synth = "synth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
  "ane.py", "ane_pack.py", "corpus.py", "deepseek.py", "evaluate.py", "extract.py", "jsonl.py",
  "label.py", "label_cli.py", "label_corpus.py", "model.py", "normalise.py", "onnx_pack.py", "pack.py", "redact.py",
  "report.py", "synth.py", "tagging.py", "train.py", "transcripts.py", "units.py",
  "unit_prompt.md", "synth_prompt.md", "fixtures",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
